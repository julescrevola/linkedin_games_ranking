  deploy_webapp:
    permissions:
      id-token: write
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          platforms: linux/amd64

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        run: |
          WEBAPP_NAME="${{ secrets.WEBAPP_NAME }}"
          RESOURCE_GROUP="${{ secrets.RG }}"
          IMAGE="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          if az webapp show --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            az webapp config appsettings set \
              --name "$WEBAPP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --settings \
                SUPABASE_URL='${{ secrets.SUPABASE_URL }}' \
                SUPABASE_KEY='${{ secrets.SUPABASE_KEY }}' \
                WEBSITES_PORT=8000

            az webapp config container set \
              --name "$WEBAPP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --container-image-name "$IMAGE" \
              --container-registry-url "https://index.docker.io" \
              --container-registry-user "${{ secrets.DOCKERHUB_USERNAME }}" \
              --container-registry-password "${{ secrets.DOCKERHUB_PASSWORD }}"

            az webapp restart --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP"
          else
            az appservice plan create \
              --name "${WEBAPP_NAME}-plan" \
              --resource-group "$RESOURCE_GROUP" \
              --sku B1 \
              --is-linux

            az webapp create \
              --name "$WEBAPP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --plan "${WEBAPP_NAME}-plan" \
              --deployment-container-image-name "$IMAGE"

            az webapp config appsettings set \
              --name "$WEBAPP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --settings \
                SUPABASE_URL='${{ secrets.SUPABASE_URL }}' \
                SUPABASE_KEY='${{ secrets.SUPABASE_KEY }}' \
                WEBSITES_PORT=8000 \
                DOCKER_REGISTRY_SERVER_URL="https://index.docker.io" \
                DOCKER_REGISTRY_SERVER_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" \
                DOCKER_REGISTRY_SERVER_PASSWORD="${{ secrets.DOCKERHUB_PASSWORD }}"
          fi
