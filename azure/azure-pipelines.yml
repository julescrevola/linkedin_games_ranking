- stage: Deploy
  displayName: Deploy to Azure Web App
  dependsOn: Build
  jobs:
  - deployment: DeployWebApp
    displayName: Deploy to Azure Web App (container)
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'linkedin_games_ranking'
    variables:
      - group: Release
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: linkedin-games-ranking

          - task: AzureCLI@2
            displayName: Deploy container to Azure Web App
            inputs:
              azureSubscription: service-connection-linkedin-games-ranking
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                WEBAPP_NAME="$(webAppName)"
                RESOURCE_GROUP="$(ResourceGroup)"
                IMAGE="$(linkedinGamesRankingRepository):$(tag)"

                if az webapp show --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
                  az webapp config appsettings set \
                    --name "$WEBAPP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --settings \
                      SUPABASE_URL="$SUPABASE_URL" \
                      SUPABASE_KEY="$SUPABASE_KEY" \
                      WEBSITES_PORT=8000

                  az webapp config container set \
                    --name "$WEBAPP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --container-image-name "$IMAGE" \
                    --container-registry-url "https://index.docker.io" \
                    --container-registry-user "$(DOCKERHUB_USERNAME)" \
                    --container-registry-password "$(DOCKERHUB_PASSWORD)"

                  az webapp restart --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP"
                else
                  az appservice plan create \
                    --name "${WEBAPP_NAME}-plan" \
                    --resource-group "$RESOURCE_GROUP" \
                    --sku B1 \
                    --is-linux

                  az webapp create \
                    --name "$WEBAPP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --plan "${WEBAPP_NAME}-plan" \
                    --deployment-container-image-name "$IMAGE"

                  az webapp config appsettings set \
                    --name "$WEBAPP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --settings \
                      SUPABASE_URL="$SUPABASE_URL" \
                      SUPABASE_KEY="$SUPABASE_KEY" \
                      WEBSITES_PORT=8000 \
                      DOCKER_REGISTRY_SERVER_URL="https://index.docker.io" \
                      DOCKER_REGISTRY_SERVER_USERNAME="$(DOCKERHUB_USERNAME)" \
                      DOCKER_REGISTRY_SERVER_PASSWORD="$(DOCKERHUB_PASSWORD)"
                fi
