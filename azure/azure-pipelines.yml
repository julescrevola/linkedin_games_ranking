trigger:
- 'main'

variables:
  buildConfiguration: 'Release'
  linkedinGamesRankingRepository: 'julescrevola/linkedin-games'
  tag: '$(Build.BuildId)'
  imagePullSecret: 'secret'
  acaAppName: $(ACA_NAME)
  webAppName: $(WEBAPP_NAME)
  ResourceGroup: $(RG)
  acaEnvironment: $(ACA_ENV_NAME)
  acaTargetPort: '8000'

stages:
- stage: Build
  displayName: Build and push Docker image
  jobs:
  - job: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: Build and push to Docker Hub
      inputs:
        command: buildAndPush
        buildContext: $(Build.Repository.LocalPath)
        repository: $(linkedinGamesRankingRepository)
        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        containerRegistry: 'service-connection-docker'
        tags: |
          $(tag)

    - publish: '$(Build.SourcesDirectory)'
      artifact: linkedin-games-ranking


